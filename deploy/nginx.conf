server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Versi Nginx tidak perlu dibocorkan.
    server_tokens off;

    # Header keamanan dasar. Header ini juga dipasang Caddy; diulang di sini
    # agar container frontend tetap aman bila diakses langsung.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aset ber-hash boleh di-cache lama; berkas HTML tidak.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Logo dan ikon situs.
    #
    # Berkas di /brand/ TIDAK ber-hash, jadi nama lamanya dipegang browser
    # pengunjung. `expires 7d` (bukan `immutable` setahun) memberi umur cache
    # yang cukup panjang untuk menghemat unduhan di setiap halaman, tetapi
    # masih memungkinkan perbaikan logo sampai ke pengunjung dalam hitungan
    # hari tanpa harus mengganti nama berkas. Bila logo diganti permanen,
    # naikkan nama berkasnya (mis. -v2.png) agar cache lama dilewati.
    #
    # Header keamanan diulang di sini dengan sengaja: `add_header` di dalam
    # `location` MENGGANTIKAN seluruh header warisan dari level `server`, jadi
    # tanpa pengulangan ini aset gambar kehilangan nosniff dan Referrer-Policy.
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Panel pelanggan dan admin hidup di /app/* dan memakai bundel app.html.
    # Tanpa aturan ini, refresh di /app/admin/pengguna akan menyajikan bundel
    # situs publik sehingga panel tampak kosong. Path /app dan /app/ diarahkan
    # permanen agar alamat yang dibagikan tidak pernah setengah jalan.
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        # Berkas statis milik panel (bila ada) tetap dilayani apa adanya.
        try_files $uri /app.html;
        add_header Cache-Control "no-store";
    }

    # Situs publik: rute seperti /harga tidak punya berkas sendiri, jadi
    # index.html yang dilayani agar aplikasi tetap bisa memuat.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Health check container. `add_header` tidak berpengaruh pada `return`,
    # jadi tipe konten ditetapkan lewat `default_type`.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
