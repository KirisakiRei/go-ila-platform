server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Versi Nginx tidak perlu dibocorkan.
    server_tokens off;

    # Header keamanan dasar. Header ini juga dipasang Caddy; diulang di sini
    # agar container frontend tetap aman bila diakses langsung.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aset ber-hash boleh di-cache lama; index.html tidak.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: rute seperti /sinyal tidak punya berkas sendiri, jadi
    # index.html yang dilayani agar aplikasi tetap bisa memuat.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Health check container. `add_header` tidak berpengaruh pada `return`,
    # jadi tipe konten ditetapkan lewat `default_type`.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
