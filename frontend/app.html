<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Panel pelanggan tidak boleh diindeks mesin pencari. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171717" />
    <script>
      (function () {
        try {
          if (!/^\/(dashboard|mulai|sinyal|posisi|akun|strategi|backtest|pengaturan|laporkan-bug|langganan)(\/|$)/.test(location.pathname)) return;
          var p = localStorage.getItem('ila_user_theme');
          var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0e0e11');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ILA Platform" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!-- Logo header dipakai tiap halaman; preload memakai dua varian sekaligus
         agar layar retina langsung memilih berkas yang tepat tanpa menunggu
         CSS dievaluasi. Berkasnya turunan kecil (7-21 KB), bukan 660 KB. -->
    <link
      rel="preload"
      as="image"
      href="/brand/logo-light-64.png"
      imagesrcset="/brand/logo-light-64.png 1x, /brand/logo-light-128.png 2x"
    />
    <title>Imaginary Liquidity — Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
